# Builds, tests and packages TabScore2 for release.
#
# - On every push to master and every pull request: build + test (catches breakage early)
# - On a tag like v1.0.3: also packages the release and attaches the zip to a GitHub Release
# - Can also be run by hand from the Actions tab (Run workflow)
#
# The package layout matches what Program.cs expects outside development mode:
#   TabScore2\TabScore2.exe
#   TabScore2\GrpcBwsDatabaseServer\GrpcBwsDatabaseServer.exe   (x86, for the 32-bit Access ODBC driver)
#   TabScore2\SplashScreen\SplashScreen.exe

name: Release build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write   # needed to create the GitHub Release on tag builds

jobs:
  build:
    runs-on: windows-latest
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true

    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      # The solution has no single platform that builds everything: the database server is x86 only,
      # the rest is x64.  So each project is built with its own platform.
      - name: Build database server (x86)
        run: dotnet build GrpcBwsDatabaseServer/GrpcBwsDatabaseServer.csproj -c Release -p:Platform=x86

      - name: Build TabScore2, splash screen and tests (x64)
        run: |
          dotnet build TabScore2/TabScore2.csproj -c Release -p:Platform=x64
          dotnet build SplashScreen/SplashScreen.csproj -c Release -p:Platform=x64
          dotnet build TabScore2.Tests/TabScore2.Tests.csproj -c Release -p:Platform=x64

      - name: Run tests
        run: dotnet test TabScore2.Tests/TabScore2.Tests.csproj -c Release -p:Platform=x64 --no-build --logger "trx;LogFileName=test-results.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: '**/TestResults/*.trx'

      # Framework-dependent publish, same as the development build: the club PC needs the .NET 8 x64 Desktop
      # and ASP.NET Core runtimes, plus the .NET 8 x86 ASP.NET Core runtime for the database server
      - name: Publish
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        run: |
          dotnet publish TabScore2/TabScore2.csproj -c Release -p:Platform=x64 -o package/TabScore2
          dotnet publish GrpcBwsDatabaseServer/GrpcBwsDatabaseServer.csproj -c Release -p:Platform=x86 -o package/TabScore2/GrpcBwsDatabaseServer
          dotnet publish SplashScreen/SplashScreen.csproj -c Release -p:Platform=x64 -o package/TabScore2/SplashScreen

      - name: Zip package
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: |
          $name = if ($env:GITHUB_REF_TYPE -eq 'tag') { "TabScore2-$env:GITHUB_REF_NAME" } else { "TabScore2-$($env:GITHUB_SHA.Substring(0,7))" }
          Compress-Archive -Path package/TabScore2 -DestinationPath "$name.zip"
          "PACKAGE_ZIP=$name.zip" | Out-File -FilePath $env:GITHUB_ENV -Append

      # archive: false uploads the zip as-is (upload-artifact v7+), instead of wrapping it in a second zip
      - name: Upload package
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          path: ${{ env.PACKAGE_ZIP }}
          archive: false

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ env.PACKAGE_ZIP }}
          generate_release_notes: true
